spring.application.name=snackspotApi

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snackspotdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://snackspot-frontend.onrender.com,http://localhost:5173,http://localhost:5175}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Configuration
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
