spring.application.name=snackspotApi

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snackspotdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_postgres_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175}
